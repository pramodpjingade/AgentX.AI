apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentx-api
  labels:
    app: agentx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agentx
  template:
    metadata:
      labels:
        app: agentx
    spec:
      containers:
      - name: gateway
        image: agentx/api:latest
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /auth/login
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /auth/login
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
